services:
  espfc:
    image: espfc-builder
    build:
      context: docker
    hostname: espfc
    stdin_open: true
    tty: true
    group_add:
      - dialout
    volumes:
      - ./:/app
      - platformio:/home/ubuntu/.platformio
    # Note: COM port device mapping not supported on Docker Desktop for Windows
    # Use network upload (OTA) or upload from Windows directly instead

volumes:
  platformio:
